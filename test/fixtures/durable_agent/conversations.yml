# High ids so the real sidecar, which numbers from 2, never collides in the round-trip test. The root
# conversation (id 1) is the one the sidecar creates at boot. `record` is pi-durable's ConversationRecord as JSON
# text; created_at is the database's default when the sidecar inserts the row.
<% json = ->(value) { value.to_json.to_json } %>
root:
  id: 1
  record: <%= json.({ id: 1 }) %>
  created_at: <%= 3.days.ago.to_fs(:db) %>

idle:
  id: 900001
  record: <%= json.({ id: 900001 }) %>
  created_at: <%= 2.days.ago.to_fs(:db) %>

busy:
  id: 900002
  record: <%= json.({ id: 900002 }) %>

failed:
  id: 900003
  record: <%= json.({ id: 900003 }) %>

forked:
  id: 900004
  record: <%= json.({ id: 900004, parent: { conversationId: 900001, at: 900102 } }) %>
  created_at: <%= 1.day.ago.to_fs(:db) %>

# A real-provider conversation whose last request errored: the model answered with stopReason "error".
errored:
  id: 900006
  record: <%= json.({ id: 900006 }) %>
  created_at: <%= 3.days.ago.to_fs(:db) %>

owned:
  id: 900005
  owner_conversation_id: 900002
  owner_task_id: 900601
  record: <%= json.({ id: 900005, owner: { conversationId: 900002, taskId: 900601 } }) %>

# Started with DurableAgent.start(account: "u42"): its model runs on account u42's OpenAI credential.
on_account:
  id: 900007
  record: <%= json.({ id: 900007 }) %>
  created_at: <%= 1.day.ago.to_fs(:db) %>
