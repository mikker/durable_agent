  kind: <%= indexed("pi.inbox") %>
  owner_id: 900002
  record: <%= record.(900504, "pi.inbox", 900002, "latest") %>

forked_notes:
  <<: *DEFAULTS
  id: 900505
  kind: <%= indexed("app.notes") %>
  owner_id: 900004
  created_at: 9
  record: <%= record.(900505, "app.notes", 900004, "rewindable", created_at: 9) %>

on_account_agent:
