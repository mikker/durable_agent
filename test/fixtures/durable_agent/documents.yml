# Columns as pi-durable's storage core writes them: `kind` and `key_value` JSON-encoded, `created_at` and
# `retired_at` commit seqs, `record` the DocumentRecord. The values are in document_revisions.yml.
<% record = ->(id, kind, owner, history, created_at: 1, **extra) {
  json_text({ id: id, kind: kind, scope: { kind: "conversation", conversationId: owner }, history: history, fork: "copy",
    createdAt: created_at, **extra }) } %>
DEFAULTS: &DEFAULTS
  family: 0
  key_value: <%= indexed("") %>
  scope_kind: conversation
  created_at: 1

idle_live:
  <<: *DEFAULTS
  id: 900501
  kind: <%= indexed("pi.live") %>
  owner_id: 900001
  record: <%= record.(900501, "pi.live", 900001, "latest") %>

idle_retired_inbox:
  <<: *DEFAULTS
  id: 900502
  kind: <%= indexed("pi.inbox") %>
  owner_id: 900001
  retired_at: 3
  record: <%= record.(900502, "pi.inbox", 900001, "latest", retiredAt: 3) %>

failed_agent:
  <<: *DEFAULTS
  id: 900506
  kind: <%= indexed("pi.agent") %>
  owner_id: 900003
  record: <%= record.(900506, "pi.agent", 900003, "rewindable") %>

errored_agent:
  <<: *DEFAULTS
  id: 900507
  kind: <%= indexed("pi.agent") %>
  owner_id: 900006
  record: <%= record.(900507, "pi.agent", 900006, "rewindable") %>

idle_usage:
  <<: *DEFAULTS
  id: 900508
  kind: <%= indexed("pi.usage") %>
  owner_id: 900001
  record: <%= record.(900508, "pi.usage", 900001, "latest") %>

busy_live:
  <<: *DEFAULTS
  id: 900503
  kind: <%= indexed("pi.live") %>
  owner_id: 900002
  record: <%= record.(900503, "pi.live", 900002, "latest") %>

busy_inbox:
