# Columns as pi-durable's storage core writes them: `kind` and `key_value` JSON-encoded, `created_at` and
# `retired_at` commit seqs, `record` the DocumentRecord. The values are in document_revisions.yml.
<% json = ->(value) { value.to_json.to_json } %>

idle_live:
  id: 900501
  kind: <%= DurableAgent::IndexedString.encode("pi.live").to_json %>
  family: 0
  key_value: <%= DurableAgent::IndexedString.encode("").to_json %>
  scope_kind: conversation
  owner_id: 900001
  created_at: 1
  record: <%= json.({ id: 900501, kind: "pi.live", scope: { kind: "conversation", conversationId: 900001 }, history: "latest", fork: "copy", createdAt: 1 }) %>

