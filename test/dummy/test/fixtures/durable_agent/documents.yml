# The busy chat's live state. Columns as pi-durable's storage core writes them: `kind` and `key_value`
# JSON-encoded (DurableAgent::IndexedString), `created_at` a commit seq, `record` the DocumentRecord as JSON text.
# The values are in document_revisions.yml.
<% json = ->(value) { value.to_json.to_json } %>
busy_live:
  id: 900503
  kind: <%= DurableAgent::IndexedString.encode("pi.live").to_json %>
  family: 0
  key_value: <%= DurableAgent::IndexedString.encode("").to_json %>
  scope_kind: conversation
  owner_id: 900002
  created_at: 1
  record: <%= json.({ id: 900503, kind: "pi.live", scope: { kind: "conversation", conversationId: 900002 }, history: "latest", fork: "copy", createdAt: 1 }) %>

