# The app runs on either database, like the gem. DURABLE_AGENT_DB=postgres selects Postgres; SQLite is the default.
<% if ENV["DURABLE_AGENT_DB"] == "postgres" %>
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: durable_agent_development

test:
  <<: *default
  database: durable_agent_test
<% else %>
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  primary:
    <<: *default
    database: storage/production.sqlite3
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
<% end %>
