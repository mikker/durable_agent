# The gem runs on either database. DURABLE_AGENT_DB=postgres selects Postgres; SQLite is the default.
<% if ENV["DURABLE_AGENT_DB"] == "postgres" %>
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: durable_agent_development

test:
  <<: *default
  database: durable_agent_test

production:
  <<: *default
  database: dummy_production
  username: dummy
  password: <%= ENV["DUMMY_DATABASE_PASSWORD"] %>
<% else %>
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

production:
  <<: *default
  database: storage/production.sqlite3
<% end %>
